name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      # 提权 helper 二进制不入库（.gitignore），由 build:helper 现编现打：mac(helper/) + win(helper-win/)。
      # 必须在 mac 与 win 两个 runner 都装 Go，否则该平台 package 缺 helper 二进制 → 安装提权助手「二进制缺失」(issue #57)。
      - name: Setup Go (privilege helper, mac + win)
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache: false

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install --no-document fpm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package application
        run: npm run package:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          REQUIRE_HELPER: "1"

      - name: Create DMG (macOS, arm64 + x64)
        if: matrix.platform == 'mac'
        run: bash scripts/create-macos-dmg.sh "${GITHUB_REF#refs/tags/v}"

      - name: Create Windows ZIP (beta)
        if: matrix.platform == 'win' && contains(github.ref_name, '-beta.')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          tar.exe -a -cf "dist-package/FlowZ-${version}-win-x64.zip" -C dist-package/win-unpacked .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist-package/*.exe
            dist-package/*.dmg
            dist-package/*.AppImage
            dist-package/*.deb
            dist-package/*.zip
          retention-days: 5

  create-release:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare diagnostics and checksums
        run: |
          cp scripts/collect-flowz-windows.ps1 artifacts/
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name '*.ps1' \) -print0 | sort -z | while IFS= read -r -d '' file; do
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$digest" "$(basename "$file")"
          done > artifacts/SHA256SUMS.txt

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        # Release notes 单一来源：generate_release_notes 由 GitHub 自动从 PR 列表生成「## What's Changed」+
        # Full Changelog。不再额外注入 body（曾与 generate_release_notes 叠加导致两个 ## What's Changed 且
        # 与 PR 标题重复）；无需维护 CHANGELOG.md。
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.zip
            artifacts/collect-flowz-windows.ps1
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
